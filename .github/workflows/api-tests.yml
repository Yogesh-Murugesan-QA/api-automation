name: API Tests

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Choose suite
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "SUITE=regression.xml" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SUITE=${{ inputs.suite }}.xml" >> $GITHUB_ENV
          else
            echo "SUITE=smoke.xml" >> $GITHUB_ENV
          fi

      - name: Run tests
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: mvn clean test -DsuiteXmlFile=$SUITE

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ env.SUITE }}
          path: allure-results